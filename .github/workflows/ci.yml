name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: package/package-lock.json
          node-version: 24
      - run: npm ci
      - run: npm run verify
      - run: npm pack --dry-run --ignore-scripts
